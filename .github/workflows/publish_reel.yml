name: publication-reel-loucio

on:
  schedule:
    - cron: '30 11 * * *'   # 13h30 Paris (été)
    - cron: '30 12 * * *'   # 14h30 Paris (été) — passage de secours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-reel
  cancel-in-progress: false

jobs:
  publish-reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependances
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu fonts-liberation
          pip install --quiet pillow requests

      - name: Generer le reel du jour si la file est vide
        run: |
          python gen_reel.py --auto
          git config user.name "loucio-bot"
          git config user.email "bot@loucio.com"
          git add reels/queue
          if ! git diff --cached --quiet; then
            git commit -m "reel auto $(date -u +%F)"
            git pull --rebase && git push
          fi

      - name: Publier le reel
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python publish_reel.py
