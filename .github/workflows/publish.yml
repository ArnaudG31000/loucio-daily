name: publication-loucio

on:
  schedule:
    - cron: '30 4 * * *'
    - cron: '30 5 * * *'
    - cron: '30 6 * * *'    # 2e secours matin (8h30 Paris été)
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'
    - cron: '0 21 * * *'    # 2e secours soir (23h Paris été)
  push:
    paths:
      - 'trigger/**'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Créneau à publier (matin, soir, ou auto selon l''heure)'
        type: choice
        options: [auto, matin, soir]
        default: auto

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependances
        timeout-minutes: 6
        run: |
          # ffmpeg et les polices DejaVu sont préinstallés sur les runners :
          # apt n'est qu'un complément, sa panne ne doit jamais bloquer la publication
          (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu fonts-liberation ffmpeg) \
            || echo "apt indisponible, on continue avec les paquets préinstallés"
          pip install --quiet pillow requests

      - name: Creneau
        run: |
          SLOT=auto
          if [ "${{ github.event_name }}" = "push" ] && [ -f trigger/slot.txt ]; then
            SLOT=$(cat trigger/slot.txt)
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT="${{ inputs.slot }}"
          fi
          echo "SLOT=$SLOT" >> "$GITHUB_ENV"

      - name: Publier
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python publish.py --slot "$SLOT"
