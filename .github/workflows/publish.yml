name: publication-loucio

on:
  schedule:
    # GitHub retarde souvent les crons de plusieurs heures, surtout aux heures
    # rondes : on multiplie les passages à minutes décalées. Le script sort en
    # 30 s si le créneau est déjà publié ou hors fenêtre — aucun doublon possible.
    # Matin (fenêtre 5h-10h59 Paris)
    - cron: '33 4 * * *'
    - cron: '3 5 * * *'
    - cron: '33 5 * * *'
    - cron: '3 6 * * *'
    - cron: '33 6 * * *'
    - cron: '3 7 * * *'
    # Tirs anticipés : avec les retards GitHub (3 à 7 h constatés), ces crons
    # atterrissent souvent en pleine fenêtre du soir ; à l'heure, ils rattrapent
    # un matin manqué ou sortent en 30 s.
    - cron: '33 14 * * *'
    - cron: '33 15 * * *'
    - cron: '33 16 * * *'
    - cron: '33 17 * * *'
    - cron: '33 18 * * *'
    # Soir (fenêtre 19h-23h59 Paris)
    - cron: '3 19 * * *'
    - cron: '23 19 * * *'
    - cron: '43 19 * * *'
    - cron: '3 20 * * *'
    - cron: '23 20 * * *'
    - cron: '43 20 * * *'
    - cron: '3 21 * * *'
    - cron: '23 21 * * *'
    - cron: '43 21 * * *'
  push:
    paths:
      - 'trigger/**'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Créneau à publier (matin, soir, ou auto selon l''heure)'
        type: choice
        options: [auto, matin, soir]
        default: auto

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependances
        timeout-minutes: 6
        run: |
          # ffmpeg et les polices DejaVu sont préinstallés sur les runners :
          # apt n'est qu'un complément, sa panne ne doit jamais bloquer la publication
          (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu fonts-liberation ffmpeg) \
            || echo "apt indisponible, on continue avec les paquets préinstallés"
          pip install --quiet pillow requests

      - name: Creneau
        run: |
          SLOT=auto
          if [ "${{ github.event_name }}" = "push" ] && [ -f trigger/slot.txt ]; then
            SLOT=$(cat trigger/slot.txt)
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT="${{ inputs.slot }}"
          fi
          echo "SLOT=$SLOT" >> "$GITHUB_ENV"

      - name: Publier
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python publish.py --slot "$SLOT"
