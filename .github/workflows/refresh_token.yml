name: refresh-token-instagram

# Rafraîchit le token longue durée Instagram (validité 60 jours) chaque
# semaine. Le nouveau token est chiffré (AES-256, clé dérivée du secret
# IG_TOKEN d'origine) et committé dans .automation/ig_token.enc ;
# publish.py le déchiffre à l'exécution. Le secret IG_TOKEN sert d'amorce
# et de clé de chiffrement — il ne doit pas être modifié.

on:
  schedule:
    - cron: '15 3 * * 1'   # tous les lundis, 03h15 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rafraichir le token Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          set -euo pipefail
          if [ -f .automation/ig_token.enc ]; then
            CURRENT=$(openssl enc -d -aes-256-cbc -pbkdf2 -in .automation/ig_token.enc -pass env:IG_TOKEN)
          else
            CURRENT="$IG_TOKEN"
          fi
          echo "::add-mask::$CURRENT"
          RES=$(curl -sS "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${CURRENT}")
          NEW=$(printf '%s' "$RES" | python3 -c "import json,sys; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$NEW" ]; then
            echo "Echec du refresh Instagram :"
            printf '%s' "$RES" | python3 -c "import json,sys; d=json.load(sys.stdin); e=d.get('error',d); e.pop('access_token',None); print(json.dumps(e, indent=2))" || true
            exit 1
          fi
          echo "::add-mask::$NEW"
          DAYS=$(printf '%s' "$RES" | python3 -c "import json,sys; print(int(json.load(sys.stdin).get('expires_in',0))//86400)")
          CHECK=$(curl -sS "https://graph.instagram.com/v23.0/me?fields=username&access_token=${NEW}")
          printf '%s' "$CHECK" | grep -q '"username"' || { echo "Nouveau token invalide : $CHECK"; exit 1; }
          mkdir -p .automation
          printf '%s' "$NEW" | openssl enc -aes-256-cbc -pbkdf2 -pass env:IG_TOKEN -out .automation/ig_token.enc
          git config user.name "loucio-bot"
          git config user.email "bot@loucio.com"
          git add .automation/ig_token.enc
          git commit -m "token Instagram rafraichi (auto, valide ${DAYS} jours)"
          for i in 1 2 3 4; do
            git pull --rebase && git push && break || sleep $((2**i))
          done
          echo "Token rafraichi (valide ${DAYS} jours), .automation/ig_token.enc mis a jour."
